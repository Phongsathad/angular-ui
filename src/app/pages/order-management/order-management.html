<div style="max-width: 900px; margin: 0 auto;">
  <h2>📦 2. จัดการออเดอร์ข้าวกล่อง</h2>

  <!-- ฟอร์มสร้างออเดอร์ -->
  <div style="background: #f8fafc; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 2rem;">
    <h3 style="margin-top:0;">+ สร้างออเดอร์มื้อเที่ยง</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
      <input [(ngModel)]="newOrder.customerName" placeholder="ชื่อลูกค้า" style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;" />
      <input type="number" [(ngModel)]="newOrder.quantity" placeholder="จำนวน (กล่อง)" style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;" />
      <select [(ngModel)]="newOrder.deliveryWindow" style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
        <option value="11:30 - 12:00">11:30 - 12:00 น.</option>
        <option value="12:00 - 12:30">12:00 - 12:30 น.</option>
        <option value="11:30 - 12:30">11:30 - 12:30 น.</option>
      </select>
    </div>
    <button (click)="addOrder()" style="margin-top: 1rem; background: #2563eb; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 4px; cursor: pointer;">เพิ่มออเดอร์</button>
  </div>

  <!-- รายการออเดอร์ -->
  <table style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
      <tr style="background: #f1f5f9; border-bottom: 2px solid #cbd5e1;">
        <th style="padding: 0.75rem;">รหัสออเดอร์</th>
        <th style="padding: 0.75rem;">ชื่อลูกค้า</th>
        <th style="padding: 0.75rem;">จำนวนข้าวกล่อง</th>
        <th style="padding: 0.75rem;">ช่วงเวลาส่ง</th>
        <th style="padding: 0.75rem;">สถานะ</th>
        <th style="padding: 0.75rem;">จัดการ</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of orders" style="border-bottom: 1px solid #e2e8f0;">
        <td style="padding: 0.75rem; font-weight: bold;">#{{ o.id }}</td>
        <td style="padding: 0.75rem;">{{ o.customerName }}</td>
        <td style="padding: 0.75rem;">{{ o.quantity }} กล่อง</td>
        <td style="padding: 0.75rem;"><span style="background: #e0f2fe; color: #0369a1; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem;">{{ o.deliveryWindow }}</span></td>
        <td style="padding: 0.75rem;"><span style="background: #fef3c7; color: #b45309; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem;">{{ o.status }}</span></td>
        <td style="padding: 0.75rem;">
          <button (click)="deleteOrder(o.id)" style="background: #ef4444; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer;">ยกเลิก</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
